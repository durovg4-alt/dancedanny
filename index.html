<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Danny Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root {
  --bg:#f7f4ef;--bg2:#eee9e0;--ink:#1a1612;--mid:#6b6257;
  --gold:#b8863c;--gold2:#d4a855;--stamp:#c0392b;
  --card-bg:#fdfaf5;--border:#ddd5c5;
}
body { font-family:'Manrope',sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; }

.topbar { background:var(--ink); color:var(--bg); padding:14px 24px; display:flex; justify-content:space-between; align-items:center; }
.brand { font-family:'Playfair Display',serif; font-size:20px; letter-spacing:.04em; }
.brand em { font-style:italic; color:var(--gold2); }
.mode-switch { display:flex; gap:4px; background:rgba(255,255,255,.1); padding:4px; border-radius:8px; }
.mode-btn { padding:6px 14px; border-radius:5px; border:none; background:transparent; color:rgba(255,255,255,.55); font-size:12px; font-family:'Manrope',sans-serif; font-weight:500; cursor:pointer; transition:.2s; }
.mode-btn.on { background:white; color:var(--ink); }

.screen { display:none; }
.screen.on { display:block; }

.admin-wrap { padding:28px 24px; max-width:900px; margin:0 auto; }
.admin-head { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
.admin-head h1 { font-family:'Playfair Display',serif; font-size:28px; font-weight:400; }
.admin-head p { font-size:12px; color:var(--mid); margin-top:4px; }

.btn-add { background:var(--ink); color:white; border:none; padding:11px 22px; border-radius:10px; font-size:13px; font-family:'Manrope',sans-serif; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:7px; transition:.18s; }
.btn-add:hover { background:#2e2822; }
.btn-add:disabled { opacity:.5; cursor:not-allowed; }

.clients-list { display:flex; flex-direction:column; gap:14px; }

.crow { background:var(--card-bg); border:1px solid var(--border); border-radius:16px; padding:18px 20px; transition:box-shadow .2s; }
.crow:hover { box-shadow:0 4px 20px rgba(0,0,0,.07); }
.crow-top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:14px; }
.cname { font-family:'Playfair Display',serif; font-size:19px; font-weight:400; }
.cinfo { font-size:11px; color:var(--mid); margin-top:2px; }
.cactions { display:flex; gap:8px; align-items:center; flex-shrink:0; }

.btn-mark { background:var(--gold); color:white; border:none; padding:9px 18px; border-radius:8px; font-size:13px; font-family:'Manrope',sans-serif; font-weight:600; cursor:pointer; transition:.18s; }
.btn-mark:hover { background:var(--gold2); }
.btn-mark:disabled { opacity:.5; cursor:not-allowed; }
.btn-sm { background:transparent; border:1px solid var(--border); color:var(--mid); padding:8px 13px; border-radius:8px; font-size:12px; font-family:'Manrope',sans-serif; cursor:pointer; transition:.18s; }
.btn-sm:hover { border-color:var(--ink); color:var(--ink); }
.btn-danger:hover { border-color:#c0392b; color:#c0392b; }

.stamps { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.stamp { width:34px; height:34px; border-radius:50%; border:2px dashed var(--border); display:flex; align-items:center; justify-content:center; font-size:15px; transition:.25s; flex-shrink:0; }
.stamp.done { border:2px solid var(--stamp); background:rgba(192,57,43,.06); }
.stamp.done::after { content:'✦'; color:var(--stamp); font-size:13px; }
.stamp.free-done { border:2px solid var(--gold); background:linear-gradient(135deg,rgba(184,134,60,.15),rgba(212,168,85,.08)); }
.stamp.free-done::after { content:'★'; color:var(--gold); font-size:14px; }
.stamp.free-pending { border:2px dashed var(--gold); background:rgba(184,134,60,.04); }
.stamp.free-pending::after { content:'★'; color:var(--gold2); opacity:.4; font-size:14px; }
.stamp-label { font-size:11px; color:var(--mid); margin-top:8px; }
.stamp-label b { color:var(--ink); }

/* LOADING */
.loading { text-align:center; padding:60px 20px; color:var(--mid); }
.spinner { width:32px; height:32px; border:3px solid var(--border); border-top-color:var(--gold); border-radius:50%; animation:spin .7s linear infinite; margin:0 auto 14px; }
@keyframes spin { to { transform:rotate(360deg); } }

.empty { text-align:center; padding:64px 20px; color:var(--mid); }
.empty .e-icon { font-size:52px; margin-bottom:14px; }
.empty p { font-size:14px; line-height:1.7; }

/* MODALS */
.overlay { position:fixed; inset:0; background:rgba(26,22,18,.55); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; z-index:200; opacity:0; pointer-events:none; transition:opacity .25s; }
.overlay.on { opacity:1; pointer-events:all; }
.modal { background:white; border-radius:20px; padding:32px 28px; width:100%; max-width:370px; transform:translateY(14px) scale(.97); transition:transform .25s; }
.overlay.on .modal { transform:none; }
.modal h2 { font-family:'Playfair Display',serif; font-size:24px; font-weight:400; margin-bottom:22px; }
.field { margin-bottom:15px; }
.field label { display:block; font-size:11px; color:var(--mid); margin-bottom:5px; text-transform:uppercase; letter-spacing:.08em; font-weight:600; }
.field input { width:100%; border:1.5px solid var(--border); border-radius:9px; padding:11px 13px; font-size:14px; font-family:'Manrope',sans-serif; outline:none; background:var(--bg); transition:border-color .2s; color:var(--ink); }
.field input:focus { border-color:var(--ink); background:white; }
.mbtns { display:flex; gap:10px; margin-top:6px; }
.mbtns .btn-add { flex:1; justify-content:center; }
.btn-cancel { background:transparent; border:1.5px solid var(--border); color:var(--mid); padding:11px 18px; border-radius:10px; font-size:13px; font-family:'Manrope',sans-serif; cursor:pointer; transition:.18s; }
.btn-cancel:hover { border-color:var(--mid); }

.qr-modal { text-align:center; max-width:320px; }
.qr-name { font-size:14px; color:var(--mid); margin-bottom:20px; }
#qr-container { display:flex; justify-content:center; margin-bottom:16px; }
#qr-container canvas,#qr-container img { border-radius:10px; }
.qr-url { font-size:11px; color:var(--mid); word-break:break-all; background:var(--bg); border-radius:8px; padding:10px 12px; margin-bottom:16px; cursor:pointer; border:1px solid var(--border); transition:.18s; }
.qr-url:hover { background:var(--bg2); }
.qr-hint { font-size:11px; color:var(--mid); line-height:1.6; margin-bottom:20px; }

/* CLIENT CARD */
.card-screen { min-height:calc(100vh - 52px); display:flex; align-items:center; justify-content:center; padding:24px 16px; }
.loyalty-card { width:100%; max-width:360px; background:var(--card-bg); border:1px solid var(--border); border-radius:24px; overflow:hidden; box-shadow:0 8px 40px rgba(0,0,0,.1); }
.lc-header { background:var(--ink); padding:24px 26px 20px; position:relative; overflow:hidden; }
.lc-header::before { content:''; position:absolute; top:-30px; right:-30px; width:120px; height:120px; border-radius:50%; background:rgba(184,134,60,.15); }
.lc-header::after { content:''; position:absolute; bottom:-20px; left:20px; width:80px; height:80px; border-radius:50%; background:rgba(184,134,60,.08); }
.lc-brand { font-family:'Playfair Display',serif; font-size:13px; color:rgba(255,255,255,.5); letter-spacing:.12em; margin-bottom:10px; text-transform:uppercase; }
.lc-name { font-family:'Playfair Display',serif; font-size:28px; color:white; font-weight:400; position:relative; z-index:1; }
.lc-sub { font-size:11px; color:rgba(255,255,255,.4); margin-top:4px; letter-spacing:.06em; text-transform:uppercase; }
.lc-body { padding:24px 26px; }
.lc-progress-label { font-size:11px; color:var(--mid); text-transform:uppercase; letter-spacing:.08em; font-weight:600; margin-bottom:12px; }
.lc-stamps { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:20px; }
.lc-stamp { aspect-ratio:1; border-radius:50%; border:2px dashed #ddd5c5; display:flex; align-items:center; justify-content:center; font-size:18px; transition:all .4s cubic-bezier(.34,1.56,.64,1); }
.lc-stamp.done { border:2px solid var(--stamp); background:rgba(192,57,43,.05); animation:stampIn .4s cubic-bezier(.34,1.56,.64,1); }
.lc-stamp.done::after { content:'✦'; color:var(--stamp); font-size:16px; }
.lc-stamp.gift { border:2px solid var(--gold); background:linear-gradient(135deg,rgba(184,134,60,.12),rgba(212,168,85,.06)); }
.lc-stamp.gift-earned { border:2px solid var(--gold); background:linear-gradient(135deg,rgba(184,134,60,.2),rgba(212,168,85,.1)); box-shadow:0 0 16px rgba(184,134,60,.3); animation:giftGlow 2s ease-in-out infinite; }
.lc-stamp.gift::after,.lc-stamp.gift-earned::after { content:'★'; color:var(--gold); font-size:18px; }
@keyframes stampIn { from{transform:scale(0.5) rotate(-15deg);opacity:0} to{transform:scale(1) rotate(0);opacity:1} }
@keyframes giftGlow { 0%,100%{box-shadow:0 0 10px rgba(184,134,60,.2)} 50%{box-shadow:0 0 24px rgba(184,134,60,.5)} }
.lc-status { background:var(--bg); border-radius:12px; padding:14px 16px; margin-bottom:16px; display:flex; align-items:center; gap:12px; }
.lc-status-icon { font-size:24px; }
.lc-status-text { font-size:13px; line-height:1.5; }
.lc-status-text strong { display:block; font-size:14px; color:var(--ink); }
.lc-status-text span { color:var(--mid); }
.lc-footer { padding:16px 26px; border-top:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
.lc-total { font-size:11px; color:var(--mid); }
.lc-total strong { color:var(--ink); }
.lc-badge { font-size:10px; font-weight:600; letter-spacing:.1em; color:var(--gold); border:1px solid rgba(184,134,60,.3); padding:4px 10px; border-radius:20px; text-transform:uppercase; }
.lc-refresh { display:block; text-align:center; margin-top:16px; font-size:12px; color:var(--mid); cursor:pointer; text-decoration:underline; }

.toast { position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(16px); background:var(--ink); color:white; padding:11px 22px; border-radius:30px; font-size:13px; font-weight:500; opacity:0; transition:all .28s; pointer-events:none; z-index:300; white-space:nowrap; }
.toast.on { opacity:1; transform:translateX(-50%) translateY(0); }

@media(max-width:480px){
  .topbar{padding:12px 16px;}
  .admin-wrap{padding:20px 14px;}
  .cactions{flex-wrap:wrap;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">Danny<em>Studio</em></div>
  <div class="mode-switch" id="mode-switch">
    <button class="mode-btn on" onclick="setMode('admin')">Dashboard</button>
    <button class="mode-btn" onclick="setMode('demo')">Card</button>
  </div>
</div>

<!-- ADMIN -->
<div class="screen on" id="screen-admin">
  <div class="admin-wrap">
    <div class="admin-head">
      <div>
        <h1>Clients</h1>
        <p>Tap «+1 class» after each visit</p>
      </div>
      <button class="btn-add" onclick="openAdd()"><span>+</span> New Client</button>
    </div>
    <div class="clients-list" id="clients-list">
      <div class="loading"><div class="spinner"></div>Loading...</div>
    </div>
  </div>
</div>

<!-- DEMO -->
<div class="screen" id="screen-demo">
  <div class="card-screen"><div id="demo-card"></div></div>
</div>

<!-- ADD MODAL -->
<div class="overlay" id="modal-add" onclick="overlayClick(event,'modal-add')">
  <div class="modal">
    <h2>New Client</h2>
    <div class="field"><label>Name</label><input id="in-name" type="text" placeholder="Anna Smith" /></div>
    <div class="field"><label>Phone (optional)</label><input id="in-phone" type="tel" placeholder="+1 000 000 0000" /></div>
    <div class="mbtns">
      <button class="btn-cancel" onclick="closeAdd()">Cancel</button>
      <button class="btn-add" id="btn-save" onclick="addClient()"><span>+</span> Add</button>
    </div>
  </div>
</div>

<!-- QR MODAL -->
<div class="overlay" id="modal-qr" onclick="overlayClick(event,'modal-qr')">
  <div class="modal qr-modal">
    <h2>Client QR Code</h2>
    <div class="qr-name" id="qr-client-name"></div>
    <div id="qr-container"></div>
    <div class="qr-url" id="qr-url-text" onclick="copyUrl()" title="Tap to copy"></div>
    <div class="qr-hint">📱 Client saves the link or a screenshot of the QR.<br>🔍 You scan the QR → their card opens instantly.</div>
    <button class="btn-add" style="width:100%;justify-content:center;" onclick="closeQR()">Done</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbz2j7-yeSFkzJPY414UOVCg1kYhqwRBzioygYKcHf0P2SvvLnLIWid4gkwpvKljxdVc/exec';
const BASE_URL = location.href.split('?')[0];

// ── API ──
async function api(params) {
  const url = API + '?' + new URLSearchParams(params);
  const res = await fetch(url);
  return res.json();
}

// ── TOAST ──
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 2400);
}

// ── MODE ──
function setMode(m) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('on'));
  document.getElementById('screen-' + m).classList.add('on');
  event.target.classList.add('on');
  if (m === 'demo') renderDemoCard();
}

// ── STAMPS ──
function makeStamps(visits) {
  const cycle = visits % 8;
  const justDone = visits > 0 && visits % 8 === 0;
  let html = '';
  for (let i = 0; i < 8; i++) {
    const isLast = i === 7;
    if (isLast) {
      html += `<div class="stamp ${(justDone || i < cycle) ? 'free-done' : 'free-pending'}"></div>`;
    } else {
      html += `<div class="stamp ${i < cycle ? 'done' : ''}"></div>`;
    }
  }
  return html;
}

function statusInfo(visits) {
  const cycle = visits % 8;
  if (visits > 0 && visits % 8 === 0) return { icon:'🎉', title:'Free class earned!', sub:'Cycle complete — your next class is on us' };
  if (cycle === 7) return { icon:'⭐', title:'Next class is free!', sub:'1 more class until your gift' };
  return { icon:'💃', title:`${cycle} of 7 classes`, sub:`${7 - cycle} more classes until your free one` };
}

// ── RENDER ADMIN ──
async function loadClients() {
  const list = document.getElementById('clients-list');
  list.innerHTML = '<div class="loading"><div class="spinner"></div>Загрузка...</div>';
  try {
    const clients = await api({ action: 'getAll' });
    if (!clients.length) {
      list.innerHTML = '<div class="empty"><div class="e-icon">💃</div><p>No clients yet.<br>Tap «+ New Client» to add the first one.</p></div>';
      return;
    }
    list.innerHTML = clients.map(c => {
      const cycle = c.visits % 8;
      const justDone = c.visits > 0 && c.visits % 8 === 0;
      const label = justDone
        ? `<b>🎉 Free class earned!</b>`
        : cycle === 7
        ? `<b>⭐ Next class is free!</b>`
        : `<b>${cycle}</b> of 7 classes (${7 - cycle} more to go)`;
      return `<div class="crow" id="row-${c.id}">
        <div class="crow-top">
          <div>
            <div class="cname">${c.name}</div>
            <div class="cinfo">since ${c.since} · total: ${c.visits} classes</div>
          </div>
          <div class="cactions">
            <button class="btn-mark" id="mark-${c.id}" onclick="mark('${c.id}','${c.name}')">+1 class</button>
            <button class="btn-sm" onclick="showQR('${c.id}','${c.name}')">QR</button>
            <button class="btn-sm btn-danger" onclick="del('${c.id}','${c.name}')">✕</button>
          </div>
        </div>
        <div class="stamps">${makeStamps(c.visits)}</div>
        <div class="stamp-label">${label}</div>
      </div>`;
    }).join('');
  } catch(e) {
    list.innerHTML = '<div class="empty"><div class="e-icon">⚠️</div><p>Ошибка загрузки.<br>Проверь интернет и обнови страницу.</p></div>';
  }
}

// ── MARK ──
async function mark(id, name) {
  const btn = document.getElementById('mark-' + id);
  btn.disabled = true;
  btn.textContent = '...';
  try {
    const res = await api({ action: 'mark', id });
    if (res.ok) {
      if (res.visits % 8 === 0) toast(`🎉 ${name} — free class earned!`);
      else toast(`Class marked (${res.visits % 8}/7)`);
      loadClients();
    }
  } catch(e) {
    toast('Error, please try again');
    btn.disabled = false;
    btn.textContent = '+1 class';
  }
}

// ── DELETE ──
async function del(id, name) {
  if (!confirm(`Delete ${name}?`)) return;
  await api({ action: 'delete', id });
  toast('Client deleted');
  loadClients();
}

// ── ADD ──
function openAdd() {
  document.getElementById('modal-add').classList.add('on');
  setTimeout(() => document.getElementById('in-name').focus(), 100);
}
function closeAdd() {
  document.getElementById('modal-add').classList.remove('on');
  document.getElementById('in-name').value = '';
  document.getElementById('in-phone').value = '';
}
async function addClient() {
  const name = document.getElementById('in-name').value.trim();
  if (!name) { document.getElementById('in-name').focus(); return; }
  const btn = document.getElementById('btn-save');
  btn.disabled = true;
  btn.textContent = 'Saving...';
  try {
    const res = await api({ action: 'add', name, phone: document.getElementById('in-phone').value.trim() });
    if (res.ok) {
      closeAdd();
      toast('Client added ✓');
      loadClients();
    }
  } catch(e) {
    toast('Error, please try again');
  }
  btn.disabled = false;
  btn.innerHTML = '<span>+</span> Add';
}
function overlayClick(e, id) {
  if (e.target.id === id) document.getElementById(id).classList.remove('on');
}
document.getElementById('in-name').addEventListener('keydown', e => { if (e.key === 'Enter') addClient(); });

// ── QR ──
function clientUrl(id) {
  return `${BASE_URL}?client=${id}`;
}
function showQR(id, name) {
  document.getElementById('qr-client-name').textContent = name;
  const url = clientUrl(id);
  document.getElementById('qr-url-text').textContent = url;
  const container = document.getElementById('qr-container');
  container.innerHTML = '';
  new QRCode(container, { text: url, width: 200, height: 200, colorDark: '#1a1612', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
  document.getElementById('modal-qr').classList.add('on');
}
function closeQR() {
  document.getElementById('modal-qr').classList.remove('on');
  document.getElementById('qr-container').innerHTML = '';
}
function copyUrl() {
  const url = document.getElementById('qr-url-text').textContent;
  navigator.clipboard.writeText(url).then(() => toast('Link copied ✓'));
}

// ── DEMO CARD ──
async function renderDemoCard() {
  const container = document.getElementById('demo-card');
  container.innerHTML = '<div class="loading"><div class="spinner"></div>Загрузка...</div>';
  try {
    const clients = await api({ action: 'getAll' });
    if (!clients.length) {
      container.innerHTML = '<p style="color:var(--mid);text-align:center">Add a client in the dashboard first</p>';
      return;
    }
    renderCard(clients[0], container);
  } catch(e) {
    container.innerHTML = '<p style="color:var(--mid);text-align:center">Ошибка загрузки</p>';
  }
}

// ── CLIENT CARD ──
function renderCard(c, container) {
  const st = statusInfo(c.visits);
  let stampsHtml = '';
  const cycle = c.visits % 8;
  const justDone = c.visits > 0 && c.visits % 8 === 0;
  for (let i = 0; i < 8; i++) {
    const isLast = i === 7;
    if (isLast) {
      stampsHtml += `<div class="lc-stamp ${(justDone || i < cycle) ? 'gift-earned' : 'gift'}"></div>`;
    } else {
      stampsHtml += `<div class="lc-stamp ${i < cycle ? 'done' : ''}"></div>`;
    }
  }
  container.innerHTML = `
    <div class="loyalty-card">
      <div class="lc-header">
        <div class="lc-brand">Danny Studio · Private Classes</div>
        <div class="lc-name">${c.name}</div>
        <div class="lc-sub">Loyalty Card</div>
      </div>
      <div class="lc-body">
        <div class="lc-progress-label">Progress</div>
        <div class="lc-stamps">${stampsHtml}</div>
        <div class="lc-status">
          <div class="lc-status-icon">${st.icon}</div>
          <div class="lc-status-text">
            <strong>${st.title}</strong>
            <span>${st.sub}</span>
          </div>
        </div>
      </div>
      <div class="lc-footer">
        <div class="lc-total">Total classes: <strong>${c.visits}</strong></div>
        <div class="lc-badge">Loyalty</div>
      </div>
    </div>
    <a class="lc-refresh" onclick="reloadClientCard('${c.id}', this.parentElement)">↻ Refresh</a>`;
}

async function reloadClientCard(id, container) {
  container.innerHTML = '<div class="loading"><div class="spinner"></div>Обновляю...</div>';
  try {
    const c = await api({ action: 'getOne', id });
    renderCard(c, container);
  } catch(e) {
    container.innerHTML = '<p style="color:var(--mid);text-align:center">Ошибка</p>';
  }
}

// ── CLIENT PAGE (по URL ?client=ID) ──
async function checkClientView() {
  const p = new URLSearchParams(location.search);
  const id = p.get('client');
  if (!id) return false;

  document.getElementById('mode-switch').style.display = 'none';
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));

  const wrap = document.createElement('div');
  wrap.className = 'card-screen';
  const inner = document.createElement('div');
  wrap.appendChild(inner);
  document.body.appendChild(wrap);

  inner.innerHTML = '<div class="loading"><div class="spinner"></div>Loading your card...</div>';

  try {
    const c = await api({ action: 'getOne', id });
    if (c.error) {
      inner.innerHTML = '<p style="color:var(--mid);text-align:center;padding:40px">Card not found</p>';
    } else {
      renderCard(c, inner);
    }
  } catch(e) {
    inner.innerHTML = '<p style="color:var(--mid);text-align:center;padding:40px">Loading error, please try again</p>';
  }
  return true;
}

// ── INIT ──
checkClientView().then(isClient => {
  if (!isClient) loadClients();
});
</script>
</body>
